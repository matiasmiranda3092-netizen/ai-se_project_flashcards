<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Matias Miranda" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./assets/css/index.css" />
    <title>Flash Cards</title>
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a href="./index.html" class="header__link">Flash Cards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li><a href="./index.html" class="nav__link">My Decks</a></li>
          <li><a href="./index.html" class="nav__link">About</a></li>
        </ul>
      </nav>
    </header>

    <main class="page__main-content">
      <section id="carousel" class="carousel">
        <h2 class="carousel__title"></h2>
        <div class="carousel__grid">
          <button
            type="button"
            aria-label="Go to previous card"
            class="carousel__btn carousel__btn_type_left carousel__btn_disabled"
          ></button>
          <div class="carousel__card">
            <p class="carousel__card-text"></p>
          </div>
          <button
            type="button"
            aria-label="Go to next card"
            class="carousel__btn carousel__btn_type_right"
          ></button>
          <button
            type="button"
            class="carousel__btn carousel__btn_type_flip"
            aria-label="Flip card"
          ></button>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p class="footer__text">&copy; 2026 Matias Miranda</p>
    </footer>
    <script src="./assets/js/carousel-page.js" type="module"></script>
  </body>
</html>
